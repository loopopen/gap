services:
  mariadb:
    image: mariadb:11.8
    container_name: examples-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MARIADB_DATABASE: example
    ports:
      - 3306:3306
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      examples-net:

  postgres:
    image: postgres:15-alpine 
    container_name: examples-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: example
    ports:
      - 5432:5432
    volumes:
      - postgresdata:/var/lib/postgresql/data
    networks:
      examples-net:

  redis:
    image: redis:7-alpine
    container_name: examples-redis
    command: redis-server --appendonly yes
    ports:
      - 6379:6379
    volumes:
      - redisdata:/data
    networks:
      examples-net:

  redisinsight:
    image: redis/redisinsight:latest
    container_name: examples-redisinsight
    ports:
      - 5540:5540
    volumes:
      - redisinsight:/data
    networks:
      examples-net:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: examples-rabbitmq
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - rabbitmqata:/var/lib/rabbitmq
        - rabbitmqlog:/var/log/rabbitmq
    networks:
        - examples-net

  kafka:
    image: apache/kafka:4.3.1
    container_name: examples-kafka
    ports:
      - "${KAFKA_PORT-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
      - kafkalog:/var/log/kafka
    networks:
      examples-net:

  kafka-ui:
    container_name: examples-kafka-ui
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - 8888:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    volumes:
      - kafkaui-conf:/etc/kafkaui
    networks:
      examples-net:

volumes:
  mysqldata:
  postgresdata:
  redisdata:
  redisinsight:
  rabbitmqata:
  rabbitmqlog:
  kafkadata:
  kafkalog:
  kafkaui-conf:

networks:
  examples-net:
