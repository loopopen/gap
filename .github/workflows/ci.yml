name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # broker/xconfluent links the vendored librdkafka and needs a C compiler.
      - name: Install C compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential

      - name: Test modules
        run: make test-modules

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/dashboard/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/dashboard/app/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify committed build
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "Dashboard build artifacts are out of date. Run 'make build-ui' and commit the changes." >&2
            git status --short -- dist >&2
            exit 1
          fi
